openapi: 3.0.3
info:
  title: Payments API
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
tags:
  - name: payments
  - name: customers
paths:
  /payments:
    get:
      tags: [payments]
      operationId: listPayments
      summary: List payments
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: './schemas/common.yaml#/components/schemas/PaymentStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: './schemas/common.yaml#/components/schemas/Payment' }
    post:
      tags: [payments]
      operationId: createPayment
      summary: Create a payment (polymorphic payment method)
      parameters:
        - name: X-Request-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/methods.yaml#/components/schemas/PaymentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: './schemas/common.yaml#/components/schemas/Payment' }
  /payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, pattern: '^pay_[a-z0-9]{8}$' }
    get:
      tags: [payments]
      operationId: getPayment
      summary: Get payment by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: './schemas/common.yaml#/components/schemas/Payment' }
    delete:
      tags: [payments]
      operationId: cancelPayment
      summary: Cancel payment (NOT exposed in Kong -> drift)
      responses:
        '204': { description: Cancelled }
  /customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: List customers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './schemas/common.yaml#/components/schemas/Customer' }
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, minLength: 2, maxLength: 50 }
                email: { type: string, format: email }
                age: { type: integer, minimum: 18, maximum: 120 }
                tier: { type: string, enum: [free, pro, enterprise] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: './schemas/common.yaml#/components/schemas/Customer' }
  /reports/summary:
    get:
      tags: [reports]
      operationId: reportSummary
      summary: Summary report (NOT exposed in Kong -> drift)
      responses:
        '200': { description: OK }
