components:
  schemas:
    BankPayment:
      type: object
      required: [type, amount, iban]
      properties:
        type: { type: string, enum: [bank] }
        amount: { type: number, minimum: 0.01, maximum: 500000 }
        currency: { type: string, enum: [USD, EUR, INR] }
        iban: { type: string, minLength: 15, maxLength: 34, pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$' }
        reference: { type: string, maxLength: 35 }
