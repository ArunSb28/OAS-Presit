openapi: 3.0.3
info:
  title: Fleet API (discriminator, allOf inheritance)
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
paths:
  /vehicles:
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Create a vehicle - base schema + allOf children + explicit mapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Vehicle' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
components:
  schemas:
    Vehicle:
      type: object
      required: [kind, plate]
      properties:
        kind: { type: string }
        plate: { type: string, pattern: '^[A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{4}$' }
      discriminator:
        propertyName: kind
        mapping:
          car: '#/components/schemas/Car'
          truck: '#/components/schemas/Truck'
    Car:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          required: [doors]
          properties:
            doors: { type: integer, minimum: 2, maximum: 5 }
            electric: { type: boolean }
    Truck:
      allOf:
        - $ref: '#/components/schemas/Vehicle'
        - type: object
          required: [payloadKg]
          properties:
            payloadKg: { type: number, minimum: 100, maximum: 40000 }
            axles: { type: integer, minimum: 2, maximum: 8 }
